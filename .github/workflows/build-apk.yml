name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-24.04 images ship with the Android SDK preinstalled (ANDROID_HOME).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease
        env:
          # Optional: set these as repository secrets to bake keys into the APK.
          GPS_TIANDITU_KEY: ${{ secrets.GPS_TIANDITU_KEY }}
          GPS_AMAP_WEB_KEY: ${{ secrets.GPS_AMAP_WEB_KEY }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/gps-locator-china.apk

      - uses: actions/upload-artifact@v5
        with:
          name: gps-locator-china-apk
          path: dist/gps-locator-china.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/
