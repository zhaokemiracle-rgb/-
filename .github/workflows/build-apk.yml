name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
        env:
          # Optional: set these as repository secrets to bake keys into the APK.
          GPS_TIANDITU_KEY: ${{ secrets.GPS_TIANDITU_KEY }}
          GPS_AMAP_WEB_KEY: ${{ secrets.GPS_AMAP_WEB_KEY }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/gps-locator-china.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gps-locator-china-apk
          path: dist/gps-locator-china.apk
